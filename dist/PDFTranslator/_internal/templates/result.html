<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Translation Result</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(59,130,246,0.20), transparent 28%),
                radial-gradient(circle at bottom right, rgba(99,102,241,0.18), transparent 30%),
                linear-gradient(135deg, #eef4ff 0%, #f7faff 45%, #eef2ff 100%);
            min-height: 100vh;
            color: #18243d;
        }

        .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 28px 16px;
        }

        .card {
            width: 100%;
            max-width: 980px;
            background: rgba(255,255,255,0.9);
            border-radius: 28px;
            border: 1px solid rgba(255,255,255,0.7);
            backdrop-filter: blur(12px);
            box-shadow: 0 24px 64px rgba(29, 78, 216, 0.12);
            overflow: hidden;
        }

        .top {
            padding: 30px 32px 20px;
            background: linear-gradient(135deg, #1d4ed8, #4f46e5);
            color: white;
        }

        .pill {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(255,255,255,0.16);
            border: 1px solid rgba(255,255,255,0.2);
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .top h1 {
            margin: 0;
            font-size: 34px;
        }

        .top p {
            margin: 10px 0 0;
            color: rgba(255,255,255,0.92);
            line-height: 1.7;
            font-size: 14px;
        }

        .content {
            padding: 28px 32px 32px;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        .button {
            text-decoration: none;
            background: linear-gradient(135deg, #1d4ed8, #4338ca);
            color: white;
            padding: 14px 18px;
            border-radius: 16px;
            font-weight: 700;
            transition: 0.2s ease;
            box-shadow: 0 12px 26px rgba(37, 99, 235, 0.18);
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .button.secondary {
            background: #eef4ff;
            color: #1d4ed8;
            border: 1px solid #cfe0ff;
            box-shadow: none;
        }

        .preview-card {
            padding: 18px;
            border-radius: 20px;
            background: #f8fbff;
            border: 1px solid #e3e8f6;
        }

        .preview-card h3 {
            margin: 0 0 12px;
            color: #1f2a44;
        }

        pre {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.7;
            color: #334155;
            max-height: 520px;
            overflow: auto;
            background: white;
            border: 1px solid #e5ebf7;
            border-radius: 16px;
            padding: 16px;
        }

        @media (max-width: 700px) {
            .top {
                padding: 24px 20px 16px;
            }

            .content {
                padding: 20px;
            }

            .top h1 {
                font-size: 28px;
            }

            .button {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="card">
            <div class="top">
                <div class="pill">✅ Translation Completed</div>
                <h1>Your file is ready</h1>
                <p>Preview the translated text below and download the final document.</p>
            </div>

            <div class="content">
                <div class="actions">
                    <a class="button" href="{{ url_for('download_file', filename=filename) }}">Download File</a>
                    <a class="button secondary" href="{{ url_for('index') }}">Translate Another File</a>
                </div>

                <div class="preview-card">
                    <h3>Preview</h3>
                    <pre>{{ preview }}</pre>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
